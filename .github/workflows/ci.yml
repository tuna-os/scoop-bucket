name: CI

# The bucket's manifest contract lived only in a local test suite nobody was
# obliged to run (#20, #24, #5). This runs both halves on every change: the
# validator against whatever is in bucket/, and the validator's own unit tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint code and manifests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check .

  validate:
    name: Validate manifests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Both test commands are the ones CONTRIBUTING.md asks contributors to
      # run. Only the coverage gate below needs anything beyond the standard
      # library, so only it gets a pip install step.
      - name: Validate published manifests
        run: python3 tests/validate_manifests.py

      - name: Test the validator
        run: python3 -m unittest discover -s tests -v

      # codecov.yml declares a 45% project target, but neither this repo nor
      # the org has a CODECOV_TOKEN secret, so a codecov.io upload cannot
      # authenticate. Enforce the target here with coverage.py instead; add
      # the upload step once a token exists (see #66).
      - name: Install coverage
        run: pip install coverage

      - name: Enforce coverage target
        run: |
          coverage run -m unittest discover -s tests
          coverage report --fail-under=45
