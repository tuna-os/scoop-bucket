name: Publish manifests

# The bucket owns its publication (#4): read the latest bluefin-cli release,
# regenerate bucket/bluefin-cli.json, and open a PR when it changed. The run
# fails when main's manifest lags a release by more than 24 hours, so a
# skipped publication is a red run, not silence.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-manifests
  cancel-in-progress: false

jobs:
  publish:
    name: Publish bluefin-cli manifest
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      # Measured against main before regeneration and reported in the last
      # step, so the manifest PR below still opens when main is stale.
      - name: Check main is within 24h of the latest release
        id: freshness
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_manifest.py --check-freshness

      - name: Generate and validate manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update_manifest.py
          python3 scripts/validate_manifests.py --forbid-empty

      - name: Open manifest pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- bucket/ && [ -z "$(git status --porcelain -- bucket/)" ]; then
            echo "bucket/ already matches the latest release."
            exit 0
          fi
          version=$(python3 -c 'import json; print(json.load(open("bucket/bluefin-cli.json"))["version"])')
          branch="publish/bluefin-cli-${version}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists; its PR is waiting for review."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add bucket/bluefin-cli.json
          git commit -m "bucket: bluefin-cli ${version}"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "bucket: bluefin-cli ${version}" \
            --body "Generated by \`scripts/update_manifest.py\` from https://github.com/tuna-os/bluefin-cli/releases/tag/v${version}."

      - name: Fail when main lags the latest release
        if: steps.freshness.outcome == 'failure'
        run: |
          echo "::error::bucket/bluefin-cli.json on main lags the latest bluefin-cli release by more than 24 hours. Merge the open manifest PR."
          exit 1
